<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 현재 위치의 탐지 범위를 표현하는 바깥 원 -->
  <circle cx="22" cy="22" r="18" fill="#38bdf8" opacity="0.22"/>

  <!-- 지도 위에서 현재 위치를 나타내는 중심 점 -->
  <circle cx="22" cy="22" r="10" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="22" cy="22" r="7" fill="#0284c7"/>
  <circle cx="20" cy="20" r="2" fill="#7dd3fc"/>
</svg>
